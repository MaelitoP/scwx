[package]
name = "scwx"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Fast SSH, database and port-forward access to Scaleway infrastructure"
repository = "https://github.com/MaelitoP/scwx"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
toml = "1.1.4"
ureq = { version = "3.4.0", features = ["json"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
uninlined_format_args = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[dev-dependencies]
tempfile = "3.27.0"
