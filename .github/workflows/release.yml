name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Prepare assets
        run: |
          cp "target/${{ matrix.target }}/release/scwx" "scwx-${{ matrix.target }}"
          shasum -a 256 "scwx-${{ matrix.target }}" > "scwx-${{ matrix.target }}.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            scwx-${{ matrix.target }}
            scwx-${{ matrix.target }}.sha256
